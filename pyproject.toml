[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-saga"
version = "1.0.0"
description = "Contrato da Saga da oficina: rastreio W3C e propagacao pelo SQS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
newrelic = ["newrelic>=9.0,<10.0"]

[tool.setuptools]
packages = ["oficina_saga"]
