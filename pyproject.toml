[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-saga"
version = "1.0.0"
description = "Contrato da Saga da oficina: rastreio W3C e propagacao pelo SQS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
newrelic = ["newrelic>=9.0,<10.0"]
# envelope.validar e maquina.carregar leem os schemas e o yaml do contrato
validacao = ["jsonschema>=4.20,<5", "PyYAML>=6"]

[tool.setuptools]
# A pasta contrato/ vai dentro do pacote instalado como oficina_saga._contrato,
# para envelope.validar e maquina.carregar funcionarem fora deste repositorio.
packages = ["oficina_saga", "oficina_saga._contrato"]
package-dir = {"oficina_saga._contrato" = "contrato"}

[tool.setuptools.package-data]
"oficina_saga._contrato" = ["saga-estados.yaml", "schemas/*.json", "schemas/*/*.json"]
