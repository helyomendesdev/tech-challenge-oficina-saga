# Stack real da Saga em local: tres servicos + LocalStack (SQS/DynamoDB) + bancos.
# O servico criar-filas cria as filas/DLQs do AsyncAPI e a tabela DynamoDB do Execution.
# Variaveis: ver stack/variaveis.md. Subir: docker compose -f stack/docker-compose.yml up --build
# Os servicos sao construidos direto do git (Dockerfile na raiz de cada repo).

x-aws: &aws
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

x-filas: &filas
  QUEUE_BILLING_COMANDOS_URL: ${QUEUE_BILLING_COMANDOS_URL:-http://localstack:4566/000000000000/oficina-billing-comandos.fifo}
  QUEUE_BILLING_COMANDOS_DLQ_URL: ${QUEUE_BILLING_COMANDOS_DLQ_URL:-http://localstack:4566/000000000000/oficina-billing-comandos-dlq.fifo}
  QUEUE_EXECUCAO_COMANDOS_URL: ${QUEUE_EXECUCAO_COMANDOS_URL:-http://localstack:4566/000000000000/oficina-execucao-comandos.fifo}
  QUEUE_EXECUCAO_COMANDOS_DLQ_URL: ${QUEUE_EXECUCAO_COMANDOS_DLQ_URL:-http://localstack:4566/000000000000/oficina-execucao-comandos-dlq.fifo}
  QUEUE_OS_SAGA_RESPOSTAS_URL: ${QUEUE_OS_SAGA_RESPOSTAS_URL:-http://localstack:4566/000000000000/oficina-os-saga-respostas.fifo}
  QUEUE_OS_SAGA_RESPOSTAS_DLQ_URL: ${QUEUE_OS_SAGA_RESPOSTAS_DLQ_URL:-http://localstack:4566/000000000000/oficina-os-saga-respostas-dlq.fifo}

x-newrelic: &newrelic
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
  NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-oficina}

services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  criar-filas:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../contrato:/app/contrato:ro
      - ../stack:/app/stack:ro
    environment:
      <<: *aws
      EXECUTION_DYNAMODB_TABLE: ${EXECUTION_DYNAMODB_TABLE:-oficina-execucao}
    command: >
      sh -c "pip install --no-cache-dir boto3 pyyaml &&
             python stack/criar_filas.py &&
             python stack/criar_tabela_execucao.py"
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  postgres-os:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_OS_DB:-os}
      POSTGRES_USER: ${POSTGRES_OS_USER:-os}
      POSTGRES_PASSWORD: ${POSTGRES_OS_PASSWORD:-os}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OS_USER:-os} -d ${POSTGRES_OS_DB:-os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-billing:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_BILLING_DB:-billing}
      POSTGRES_USER: ${POSTGRES_BILLING_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:?gere com python stack/gerar_chaves_e2e.py (ver stack/variaveis.md)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BILLING_USER:-billing} -d ${POSTGRES_BILLING_DB:-billing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  os:
    # OS_GIT_URL/OS_GIT_REF: testar um PR antes do merge (ex.: fork + branch do PR).
    build: &build-os ${OS_GIT_URL:-https://github.com/helyomendesdev/tech-challenge-oficina-os.git}#${OS_GIT_REF:-main}
    image: oficina-os:local
    environment: &env-os
      <<: [*aws, *filas, *newrelic]
      # Uma fila de comandos por destinatario (contrato v1, -os#17/#18).
      SAGA_BILLING_QUEUE_URL: ${QUEUE_BILLING_COMANDOS_URL:-http://localstack:4566/000000000000/oficina-billing-comandos.fifo}
      SAGA_EXECUTION_QUEUE_URL: ${QUEUE_EXECUCAO_COMANDOS_URL:-http://localstack:4566/000000000000/oficina-execucao-comandos.fifo}
      SAGA_RESPONSE_QUEUE_URL: ${QUEUE_OS_SAGA_RESPOSTAS_URL:-http://localstack:4566/000000000000/oficina-os-saga-respostas.fifo}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_OS:-oficina-os}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      RUN_MIGRATIONS: "true"
      DB_HOST: postgres-os  # app/settings.py:71 le DB_HOST
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,os
      POSTGRES_DB: ${POSTGRES_OS_DB:-os}
      POSTGRES_USER: ${POSTGRES_OS_USER:-os}
      POSTGRES_PASSWORD: ${POSTGRES_OS_PASSWORD:-os}
    ports:
      - "8000:8000"
    depends_on:
      postgres-os:
        condition: service_healthy
      criar-filas:
        condition: service_completed_successfully

  # Consumidor das respostas da Saga: o entrypoint do -os so sobe o gunicorn, e
  # o consumo e o management command consumir_respostas_saga. Mesma imagem.
  os-consumidor:
    build: *build-os
    image: oficina-os:local
    command: ["python", "manage.py", "consumir_respostas_saga"]
    # A imagem herda o healthcheck HTTP do gunicorn, mas o consumidor nao serve HTTP:
    # saudavel = o processo do management command (PID 1) vivo. Sem healthcheck o
    # `up --wait` falha.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      <<: *env-os
      RUN_MIGRATIONS: "false"  # quem migra e o servico os
    depends_on:
      os:
        condition: service_healthy
      # Depender do seed (one-shot) faz o `up --wait` aceitar a saida 0 dele.
      seed-os:
        condition: service_completed_successfully

  # Seed one-shot do -os para o BDD: servico 12 e peca 40 (catalogo do Billing) e o atendente de demo.
  # ATENDENTE_PASSWORD vazio = o seed_atendente_demo nao cria o usuario (ver stack/variaveis.md).
  seed-os:
    build: *build-os
    image: oficina-os:local
    volumes:
      - ./seed_os.py:/stack/seed_os.py:ro
    command:
      - sh
      - -c
      - python manage.py shell < /stack/seed_os.py && python manage.py seed_atendente_demo
    environment:
      <<: *env-os
      RUN_MIGRATIONS: "false"  # quem migra e o servico os
      ATENDENTE_USERNAME: ${ATENDENTE_USERNAME:-atendente.demo}
      ATENDENTE_PASSWORD: ${ATENDENTE_PASSWORD:-}
    depends_on:
      os:
        condition: service_healthy
    restart: "no"

  # Billing: a imagem sobe so a API (uvicorn). Migrate, consumer, relay e operations
  # sao o mesmo `billing_service.cli` em processos separados, como no compose.yml
  # e no compose.team.override.yml do proprio -billing.
  billing:
    build: &build-billing https://github.com/helyomendesdev/tech-challenge-oficina-billing.git#${BILLING_GIT_REF:-main}
    image: oficina-billing:local
    environment: &env-billing
      <<: [*aws, *filas, *newrelic]
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_BILLING:-oficina-billing}
      # psycopg 3 (requirements do -billing): o dialeto precisa ser postgresql+psycopg.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_BILLING_USER:-billing}:${POSTGRES_BILLING_PASSWORD:?gere com python stack/gerar_chaves_e2e.py}@postgres-billing:5432/${POSTGRES_BILLING_DB:-billing}
      # Pagamento fake + development: unico modo em que `cli simulate-payment` roda (usado pelo BDD).
      APP_ENV: development
      PAYMENT_PROVIDER: fake
      # Chave publica (PEM em base64) que valida o JWT do cliente; gerar o par com stack/gerar_chaves_e2e.py.
      AUTH_JWT_PUBLIC_KEY_B64: ${AUTH_JWT_PUBLIC_KEY_B64:-}
    ports:
      - "8001:8000"
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      criar-filas:
        condition: service_completed_successfully

  billing-migrate:
    build: *build-billing
    image: oficina-billing:local
    command: ["python", "-m", "billing_service.cli", "migrate"]
    environment: *env-billing
    depends_on:
      postgres-billing:
        condition: service_healthy
    restart: "no"

  billing-consumidor:
    build: *build-billing
    image: oficina-billing:local
    command: ["python", "-m", "billing_service.cli", "consume"]
    environment: *env-billing
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      criar-filas:
        condition: service_completed_successfully

  billing-relay:
    build: *build-billing
    image: oficina-billing:local
    command: ["python", "-m", "billing_service.cli", "relay"]
    environment: *env-billing
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      criar-filas:
        condition: service_completed_successfully

  billing-operations:
    build: *build-billing
    image: oficina-billing:local
    command: ["python", "-m", "billing_service.cli", "operations"]
    environment: *env-billing
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  execucao:
    # O codigo do Execution ainda esta na branch feat/execution-service (a main so
    # tem esqueleto, sem Dockerfile). Trocar o padrao para main depois do merge.
    build: https://github.com/helyomendesdev/tech-challenge-oficina-execution.git#${EXECUTION_GIT_REF:-feat/execution-service}
    environment:
      <<: [*aws, *newrelic]
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_EXECUCAO:-oficina-execucao}
      EXECUTION_COMMANDS_QUEUE_URL: ${QUEUE_EXECUCAO_COMANDOS_URL:-http://localstack:4566/000000000000/oficina-execucao-comandos.fifo}
      SAGA_RESPONSES_QUEUE_URL: ${QUEUE_OS_SAGA_RESPOSTAS_URL:-http://localstack:4566/000000000000/oficina-os-saga-respostas.fifo}
      EXECUTION_DYNAMODB_TABLE: ${EXECUTION_DYNAMODB_TABLE:-oficina-execucao}
    # Sem porta: o Execution e so consumidor SQS + relay de outbox, sem HTTP.
    depends_on:
      criar-filas:
        condition: service_completed_successfully
