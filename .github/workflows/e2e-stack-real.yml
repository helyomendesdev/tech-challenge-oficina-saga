name: BDD contra a stack real

# Disparo manual: sobe os tres servicos a partir do git e leva minutos, entao nao
# bloqueia PR. A CI dos PRs roda o motor de referencia (ci.yml).
on:
  workflow_dispatch:
    inputs:
      os_git_ref:
        description: "Branch/tag do -os a subir (ex.: a de um PR ainda nao mergeado)"
        default: main
      os_git_url:
        description: "Repositorio do -os (ex.: um fork com a branch do PR)"
        default: https://github.com/helyomendesdev/tech-challenge-oficina-os.git

jobs:
  stack-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      OS_GIT_REF: ${{ inputs.os_git_ref }}
      OS_GIT_URL: ${{ inputs.os_git_url }}
      SAGA_E2E_DRIVER: stack-real
      SAGA_E2E_OS_URL: http://127.0.0.1:8000  # porta publicada do servico os no compose
      SAGA_E2E_BILLING_URL: http://127.0.0.1:8001
      SAGA_E2E_TIMEOUT_S: "120"
      # Billing com provider fake: o driver confirma o pagamento pelo cli do Billing.
      SAGA_E2E_SIMULAR_PAGAMENTO_CMD: >-
        docker compose --env-file stack/.local/e2e.env -f stack/docker-compose.yml
        exec -T billing python -m billing_service.cli simulate-payment
        --payment-id {payment_id} --outcome {outcome}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Gerar chave e senhas de teste (stack/.local/e2e.env, fora do git)
        run: |
          python stack/gerar_chaves_e2e.py > /dev/null
          grep -v '^#' stack/.local/e2e.env >> "$GITHUB_ENV"

      - name: Subir a stack (o servico criar-filas cria filas e DLQs do AsyncAPI antes dos servicos)
        run: docker compose --env-file stack/.local/e2e.env -f stack/docker-compose.yml up -d --build --wait

      - name: BDD contra os servicos reais
        run: pytest -q e2e -rA

      - name: Logs dos servicos
        if: always()
        run: docker compose --env-file stack/.local/e2e.env -f stack/docker-compose.yml logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose --env-file stack/.local/e2e.env -f stack/docker-compose.yml down -v
